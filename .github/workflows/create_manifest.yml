name: Generate Manifest

on:
  push:
    branches:
      - main
    paths:
      - "userscripts/**/*.user.js"

permissions:
  contents: write

jobs:
  build_manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          manifest_path=".github/manifest.json"
          echo "{" > "$manifest_path"
          first_entry=true

          while IFS= read -r file_path; do
            name=$(grep -oP '@name\s+\K.*' "$file_path" | head -1)
            version=$(grep -oP '@version\s+\K.*' "$file_path" | head -1)
            url=$(grep -oP '@updateURL\s+\K.*' "$file_path" | head -1)

            if [ -z "$url" ]; then
              url=$(grep -oP '@downloadURL\s+\K.*' "$file_path" | head -1)
            fi

            if [ -z "$name" ] || [ -z "$version" ] || [ -z "$url" ]; then
              continue
            fi

            # Escape backslashes and double quotes for valid JSON
            escaped_name=$(echo "$name" | sed 's/\\/\\\\/g; s/"/\\"/g')

            if [ "$first_entry" = false ]; then
              echo "," >> "$manifest_path"
            fi
            first_entry=false

            printf '  "%s": { "version": "%s", "url": "%s" }' "$escaped_name" "$version" "$url" >> "$manifest_path"
          done < <(find userscripts -type f -name "*.user.js")

          echo "" >> "$manifest_path"
          echo "}" >> "$manifest_path"

      - name: Commit manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/manifest.json
          git diff --staged --quiet || git commit -m "Update manifest.json"
          git push